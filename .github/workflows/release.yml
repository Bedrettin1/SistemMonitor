name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build EXE & release assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          pip install -r kaynak/requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --icon=icon.ico --name "SistemMonitor" --add-data "icon.png;." --add-data "lhmlibs;lhmlibs" --hidden-import=png --hidden-import=PIL.PngImagePlugin --hidden-import=clr --hidden-import=pythonnet sistem_monitor.py --distpath dist
        working-directory: kaynak

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -Path kaynak\dist\SistemMonitor.exe).Hash
          "SistemMonitor.exe $hash" | Set-Content -Encoding ascii kaynak\dist\SHA256SUMS.txt
          Get-Content kaynak\dist\SHA256SUMS.txt

      - name: Generate SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cd kaynak
          cyclonedx-py requirements -i requirements.txt -o dist/sbom.cdx.json
        continue-on-error: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kaynak/dist/SistemMonitor.exe
            kaynak/dist/SHA256SUMS.txt
            kaynak/dist/sbom.cdx.json
            kaynak/sistem_monitor.py
          fail_on_unmatched_files: false

      - name: Repo'daki SistemMonitor.exe'yi güncelle (commit)
        shell: pwsh
        run: |
          Copy-Item kaynak/dist/SistemMonitor.exe -Destination SistemMonitor.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SistemMonitor.exe
          git commit -m "build: ${{ github.ref_name }} exe (otomatik)" || echo "degisiklik yok"
          git push origin HEAD:refs/heads/main
