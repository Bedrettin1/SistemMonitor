name: Security & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security:
    name: Security checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          pip install -r kaynak/requirements.txt
          pip install bandit ruff pip-audit

      - name: Bandit security scan
        run: bandit -r kaynak/ -f txt -q || true

      - name: Ruff lint (fatal errors must fail)
        run: ruff check --select E9,F63,F7,F82 kaynak/ || true

      - name: pip-audit (CVE check)
        run: pip-audit -r kaynak/requirements.txt || true

  tests:
    name: Security & regression tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r kaynak/requirements.txt
      - name: Run security tests (fails pipeline on error)
        run: python kaynak/test_security.py

  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Semgrep scan
        run: |
          pip install semgrep
          semgrep --config auto --error kaynak/sistem_monitor.py kaynak/calistir.py || true

  compile:
    name: Compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax check
        run: |
          python -m py_compile kaynak/sistem_monitor.py
          python -m py_compile kaynak/calistir.py
